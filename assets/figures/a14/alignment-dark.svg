<text x="150.0" y="254.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">audio frames, 20 ms each →</text>
<text x="586.0" y="106.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">the path&#x27;s column</text>
