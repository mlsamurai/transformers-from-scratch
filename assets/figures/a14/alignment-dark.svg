<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="How Whisper finds when each word was said. A few cross-attention heads, the alignment heads, look at the part of the sound each text token comes from. Their attention, tokens by audio frames, forms a bright diagonal band; dynamic time warping finds the monotonic path through it, and the path gives each word a start and an end time">
