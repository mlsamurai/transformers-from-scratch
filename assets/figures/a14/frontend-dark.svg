<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="How Whisper hears. The 16 kHz waveform is cut into overlapping windows of 400 samples (25 ms) every 160 samples (10 ms); each window becomes 201 frequency bins by a Fourier transform; 80 triangular mel filters, narrow at low frequencies and wide at high ones, sum the energy into 80 bands; the result is log-compressed, clamped to 8 orders of magnitude below its maximum and scaled to about -1 to 1">
<title>How Whisper hears. The 16 kHz waveform is cut into overlapping windows of 400 samples (25 ms) every 160 samples (10 ms); each window becomes 201 frequency bins by a Fourier transform; 80 triangular mel filters, narrow at low frequencies and wide at high ones, sum the energy into 80 bands; the result is log-compressed, clamped to 8 orders of magnitude below its maximum and scaled to about -1 to 1</title>
