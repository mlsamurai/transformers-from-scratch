<text x="14.0" y="286.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">30 s × 100 frames per second = 3,000 frames; shorter clips are padded with silence, longer ones cut</text>
<text x="14.0" y="308.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">like the ear, the bank resolves low frequencies finely and high ones coarsely</text>
