<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Whisper in one picture. Thirty seconds of sound become a log-mel spectrogram of 80 rows by 3,000 frames. Two convolutions, the second with stride 2, turn it into 1,500 vectors, which a Transformer encoder reads. A decoder writes the transcript token by token, starting from special tokens that name the task and the language, and attends to the encoder&#x27;s vectors through cross-attention">
<title>Whisper in one picture. Thirty seconds of sound become a log-mel spectrogram of 80 rows by 3,000 frames. Two convolutions, the second with stride 2, turn it into 1,500 vectors, which a Transformer encoder reads. A decoder writes the transcript token by token, starting from special tokens that name the task and the language, and attends to the encoder&#x27;s vectors through cross-attention</title>
