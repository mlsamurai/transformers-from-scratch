<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="How Whisper transcribes a recording longer than 30 seconds. It decodes one 30-second window, moves the window to the last complete segment and decodes again, passing the previous text as a prompt. Each window is first decoded greedily at temperature 0; if the output repeats itself (its compression ratio is above 2.4) or is unlikely (mean log-probability below -1), it is decoded again at a higher temperature, up to 1. A window whose no-speech probability is above 0.6 and whose text is unlikely is treated as silence">
<title>How Whisper transcribes a recording longer than 30 seconds. It decodes one 30-second window, moves the window to the last complete segment and decodes again, passing the previous text as a prompt. Each window is first decoded greedily at temperature 0; if the output repeats itself (its compression ratio is above 2.4) or is unlikely (mean log-probability below -1), it is decoded again at a higher temperature, up to 1. A window whose no-speech probability is above 0.6 and whose text is unlikely is treated as silence</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6575"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27A0E"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F8C7E"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D23F57"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A55D8"/></marker>
</defs>
<rect width="760" height="330" rx="12" fill="#FFFFFF"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#1D2430">Long recordings are read 30 seconds at a time, with a fallback for bad windows</text>
<text x="14.0" y="50.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">the defaults of openai/whisper&#x27;s transcribe(); the model itself only ever sees 30 seconds</text>
<polyline points="20.0,100.0 740.0,100.0" fill="none" stroke="#5B6575" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20.0" y="88.0" width="300.0" height="24.0" rx="9" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
<text x="170.0" y="104.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#8A5508" xml:space="preserve">window 1: 30 s</text>
<rect x="270.0" y="118.0" width="300.0" height="24.0" rx="9" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="420.0" y="134.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">window 2: 30 s</text>
<rect x="530.0" y="88.0" width="210.0" height="24.0" rx="9" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
<text x="635.0" y="104.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#8A5508" xml:space="preserve">window 3: 30 s</text>
<text x="20.0" y="160.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">each window starts at the end of the last complete segment of the one before</text>
<rect x="20.0" y="190.0" width="150.0" height="40.0" rx="9" fill="#FBE6EA" stroke="#D23F57" stroke-width="1.5"/>
<text x="95.0" y="214.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#A82D42" xml:space="preserve">decode at T = 0</text>
<polyline points="171.0,210.0 199.0,210.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="203.0" y="190.0" width="230.0" height="40.0" rx="9" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="318.0" y="214.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">repeats or unlikely?</text>
<text x="318.0" y="246.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">compression ratio &gt; 2.4, or</text>
<text x="318.0" y="262.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">mean log-probability &lt; −1</text>
<polyline points="434.0,210.0 462.0,210.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="466.0" y="190.0" width="274.0" height="40.0" rx="9" fill="#ECE8FC" stroke="#6A55D8" stroke-width="1.5"/>
<text x="603.0" y="214.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#4B39B5" xml:space="preserve">retry at T = 0.2, 0.4 … 1.0</text>
<text x="14.0" y="312.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">a window with no-speech probability &gt; 0.6 and an unlikely transcript is skipped as silence</text>
</svg>