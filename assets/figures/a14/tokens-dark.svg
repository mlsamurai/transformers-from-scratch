<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Whisper&#x27;s task format. Every output starts with the start-of-transcript token, then a language token, then transcribe or translate, then either no-timestamps or timestamp tokens around each segment. The same decoder transcribes English, writes timestamps, or translates Russian speech into English text, depending only on these first tokens. Asked for the first token after start-of-transcript, it names the language">
<title>Whisper&#x27;s task format. Every output starts with the start-of-transcript token, then a language token, then transcribe or translate, then either no-timestamps or timestamp tokens around each segment. The same decoder transcribes English, writes timestamps, or translates Russian speech into English text, depending only on these first tokens. Asked for the first token after start-of-transcript, it names the language</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B04A"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CC2B0"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2667C"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
