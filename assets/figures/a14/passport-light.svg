<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-label="whisper-tiny&#x27;s passport. Published September 2022 by OpenAI under the MIT licence. An encoder–decoder Transformer with 4 encoder and 4 decoder blocks of width 384. Audio in: a 80-band log-mel spectrogram of 30 seconds, 1,500 encoder positions. Text out: byte-level BPE with 51,865 tokens. Tasks: transcription, translation into English, language identification, timestamps. Trained on 680,000 hours of weakly supervised web audio. Good at clean speech in many languages; not for streaming, silence without a voice detector, or exact verbatim records">
<title>whisper-tiny&#x27;s passport. Published September 2022 by OpenAI under the MIT licence. An encoder–decoder Transformer with 4 encoder and 4 decoder blocks of width 384. Audio in: a 80-band log-mel spectrogram of 30 seconds, 1,500 encoder positions. Text out: byte-level BPE with 51,865 tokens. Tasks: transcription, translation into English, language identification, timestamps. Trained on 680,000 hours of weakly supervised web audio. Good at clean speech in many languages; not for streaming, silence without a voice detector, or exact verbatim records</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6575"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27A0E"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F8C7E"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D23F57"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A55D8"/></marker>
